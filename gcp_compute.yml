# Simple GCP Compute Inventory with Folders
# Minimal configuration example
# Name this file ending in .gcp.yml (e.g., inventory.gcp.yml)

plugin: gcp_compute

# Authentication
auth_kind: serviceaccount
service_account_file: gcp_compute/service-account.json

# Query all projects in these folders
folders:
  - "folders/123456789012"

# Or specify specific projects (can use both folders and projects together)
projects:
  - my-gcp-project-id

# Only get running instances
filters:
  - status = RUNNING

# Use instance name as the hostname
hostnames:
  - name

# Set ansible_host to public IP, fallback to private IP
compose:
  ansible_host: networkInterfaces[0].accessConfigs[0].natIP | default(networkInterfaces[0].networkIP)
  
# Group instances by environment label
keyed_groups:
  - key: labels.environment | default('unlabeled')
    prefix: env

